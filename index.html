<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
         background:#f5f6f8; color:#222; }
  .header { background:linear-gradient(135deg,#c7000b,#e64444); color:#fff; padding:28px 18px 22px; }
  .header h1 { font-size:20px; font-weight:600; }
  .header p { font-size:13px; opacity:.85; margin-top:6px; }
  .bar { position:sticky; top:0; z-index:9; background:#fff; padding:10px 14px;
         display:flex; align-items:center; gap:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .bar .status { flex:1; font-size:13px; color:#888; }
  .bar button { border:none; background:#c7000b; color:#fff; font-size:13px;
                padding:7px 14px; border-radius:16px; }
  .bar button:active { opacity:.8; }
  .list { padding:12px 14px 30px; }
  .card { background:#fff; border-radius:12px; padding:16px 16px 14px; margin-bottom:12px;
          box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .card .top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card h2 { font-size:16px; font-weight:600; line-height:1.4; flex:1; }
  .dist { flex-shrink:0; background:#fdeeee; color:#c7000b; font-size:12px;
          padding:3px 10px; border-radius:12px; white-space:nowrap; }
  .row { display:flex; align-items:flex-start; gap:8px; margin-top:10px; font-size:14px; color:#555; line-height:1.5; }
  .row .ico { flex-shrink:0; width:16px; text-align:center; }
  .row .val { flex:1; }
  .phone { display:inline-flex; align-items:center; gap:6px; color:#c7000b; text-decoration:none; font-weight:500; }
  .call { margin-top:12px; display:block; text-align:center; background:#c7000b; color:#fff;
          text-decoration:none; font-size:14px; padding:10px 0; border-radius:8px; }
  .call:active { opacity:.85; }
  .tip { text-align:center; color:#999; font-size:12px; padding:18px 20px 0; line-height:1.7; }
</style>
</head>
<body>

var HOURS = "10:00 - 22:00";
var userPos = null;

function haversine(lat1, lon1, lat2, lon2) {
  var R = 6371, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*rad)*Math.cos(lat2*rad) *
          Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(km) {
  return km < 1 ? Math.round(km*1000) + " m" : km.toFixed(1) + " km";
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render() {
  var arr = STORES.slice();
  if (userPos) {
    arr.forEach(function(s){ s.d = haversine(userPos.lat, userPos.lng, s.lat, s.lng); });
    arr.sort(function(a,b){ return a.d - b.d; });
  }
  var html = "";
  arr.forEach(function(s){
    html += '<div class="card"><div class="top"><h2>' + esc(s.name) + '</h2>'
      + (userPos ? '<span class="dist">距您 ' + fmtDist(s.d) + '</span>' : '')
      + '</div>'
      + '<div class="row"><span class="ico">📍</span><span class="val">' + esc(s.addr) + '</span></div>'
      + '<div class="row"><span class="ico">🕙</span><span class="val">营业时间 ' + HOURS + '</span></div>'
      + '<div class="row"><span class="ico">📞</span><span class="val"><a class="phone" href="tel:' + s.phone + '">' + s.phone + '</a></span></div>'
      + '<a class="call" href="tel:' + s.phone + '">拨打电话</a>'
      + '</div>';
  });
  document.getElementById("list").innerHTML = html;
}

function locate() {
  var st = document.getElementById("status");
  if (!navigator.geolocation) { st.textContent = "当前浏览器不支持定位，已按默认顺序展示"; return; }
  st.textContent = "正在获取您的位置…";
  navigator.geolocation.getCurrentPosition(function(pos){
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    st.textContent = "已按距离您最近排序";
    render();
  }, function(){
    st.textContent = "定位未授权，已按默认顺序展示";
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

document.getElementById("relocate").addEventListener("click", locate);
render();
locate();
</script>
</body>
</html>
